name: Diagnose Network & Portal Reachability

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Diagnostics against Official Portals
        run: |
          echo "=== 1. DNS RESOLUTION ==="
          getent ahosts upsc.gov.in || true
          getent ahosts employmentnews.gov.in || true

          echo "=== 2. EMPLOYMENT NEWS (High-Priority Discovery) ==="
          curl -Iv --connect-timeout 8 --max-time 15 "https://employmentnews.gov.in/newemp/AllJobs.aspx?k=All" || true

          echo "=== 3. UPSC IPv4 vs IPv6 ==="
          curl -4 -Iv --connect-timeout 8 --max-time 15 "https://upsc.gov.in/" || true
          curl -6 -Iv --connect-timeout 8 --max-time 15 "https://upsc.gov.in/" || true

          echo "=== 4. PIB RSS FEED ==="
          curl -Iv --connect-timeout 8 --max-time 15 "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=1" || true

          echo "=== 5. INSPECT EMPLOYMENT NEWS HTML TABLE ==="
          curl -sL "https://employmentnews.gov.in/newemp/AllJobs.aspx?k=All" | grep -i -C 3 "<table" | head -n 30 || true
