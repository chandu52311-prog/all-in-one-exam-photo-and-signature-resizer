<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-in-One Exam Photo & Signature Resizer (2026)</title>
  <meta name="description" content="Free all-in-one tool to resize Photo and Signature for SSC, UPSC, Banking IBPS, Railway RRB, and NTA exams according to official KB and dimensions.">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
    }
    body { 
      background-color: #f1f5f9; 
      color: #1e293b; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    .header-bar {
      width: 100%;
      background: linear-gradient(135deg, #1e3a8a 0%, #3d1318 100%);
      color: #ffffff;
      padding: 20px 16px;
      text-align: center;
      border-bottom: 4px solid #f59e0b;
    }
    .header-bar h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .header-bar p {
      font-size: 0.82rem;
      color: #fce8e9;
      margin-top: 5px;
    }

    .container { 
      width: 100%; 
      max-width: 460px; 
      padding: 20px 16px 40px;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    .exam-select-box {
      width: 100%;
      margin-bottom: 14px;
    }
    .exam-select-box label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .exam-select-box select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1.5px solid #94a3b8;
      background: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      outline: none;
    }

    .tab-container {
      width: 100%;
      display: flex;
      background: #e2e8f0;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      color: #475569;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #3d1318;
      color: #ffffff;
    }

    .upload-box { 
      width: 100%;
      height: 210px; 
      border: 2px dashed #7b242b; 
      border-radius: 10px; 
      background: #ffffff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      margin-bottom: 14px; 
      transition: background 0.2s;
    }
    .upload-box:hover {
      background: #fff8f8;
    }
    .upload-box img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      display: none; 
      padding: 6px;
    }
    .upload-box .icon { 
      font-size: 2.2rem; 
      color: #7b242b; 
      margin-bottom: 6px; 
    }
    .upload-box .placeholder-text { 
      font-size: 0.85rem; 
      font-weight: 600;
      color: #475569; 
      text-align: center; 
      padding: 0 10px; 
    }

    .btn { 
      width: 100%; 
      padding: 14px; 
      border: none; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 0.95rem; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; }
    .btn-generate { 
      background: #7b242b; 
      color: #ffffff; 
    }
    .btn-download { 
      background: #2e7d32; 
      color: #ffffff; 
      margin-top: 14px; 
    }

    .output-card { 
      width: 100%; 
      background: #ffffff; 
      border-radius: 10px; 
      border: 1px solid #cbd5e1; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      padding: 16px; 
      margin-top: 18px; 
      display: none; 
      flex-direction: column; 
      align-items: center; 
    }
    .specs-pill { 
      background: #ecfdf5; 
      border: 1px solid #16a34a; 
      color: #15803d; 
      padding: 5px 12px; 
      border-radius: 20px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      margin-bottom: 12px; 
    }
    .output-preview { 
      max-width: 100%; 
      border-radius: 6px; 
      border: 2px solid #16a34a; 
      object-fit: contain; 
      margin-bottom: 6px; 
    }

    .footer-text {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 25px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>ALL-IN-ONE EXAM PHOTO & SIGNATURE RESIZER</h1>
    <p>Official Dimensions • SSC, UPSC, IBPS, RRB, NEET & JEE (2026)</p>
  </div>

  <div class="container">
    <div class="exam-select-box">
      <label for="examSelect">Choose Competitive Exam:</label>
      <select id="examSelect" onchange="updateExamSpecs()">
        <option value="ssc">SSC (CGL, CHSL, MTS, GD) • Photo: 20-50KB | Sign: 10-20KB</option>
        <option value="upsc">UPSC (IAS, IPS, NDA, CDS) • Photo: 20-300KB | Sign: 20-300KB</option>
        <option value="ibps">Banking (IBPS, SBI PO/Clerk) • Photo: 20-50KB | Sign: 10-20KB</option>
        <option value="rrb">Railways (RRB NTPC, Group D) • Photo: 30-70KB | Sign: 15-30KB</option>
        <option value="nta">NTA (NEET, JEE Main, CUET) • Photo: 10-200KB | Sign: 4-30KB</option>
      </select>
    </div>

    <div class="tab-container">
      <button class="tab-btn active" id="tabPhoto" onclick="setMode('photo')">Passport Photo</button>
      <button class="tab-btn" id="tabSign" onclick="setMode('sign')">Signature</button>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div id="uploadPrompt" style="display: flex; flex-direction: column; align-items: center;">
        <span class="icon" id="modeIcon">📷</span>
        <span class="placeholder-text" id="uploadText">Tap to select Passport Photo</span>
      </div>
      <img id="inputPreview" alt="Preview">
    </div>

    <button class="btn btn-generate" id="generateBtn" onclick="generateFile()">⚡ GENERATE EXAM PHOTO</button>

    <div class="output-card" id="outputCard">
      <div class="specs-pill" id="specsLabel">VERIFIED READY FOR UPLOAD</div>
      <img id="outputImg" class="output-preview" alt="Generated File">
      <button class="btn btn-download" onclick="handleDownload()">📥 Download</button>
    </div>

    <div class="footer-text">
      Offline Client-Side Processing • Your files are never uploaded to any server.<br>
      Independent utility tool for student exam preparation.
    </div>
  </div>

  <script>
    let activeMode = 'photo';
    let rawImage = null;
    let base64Output = null;

    const ADSTERRA_DIRECT_LINK = "https://www.profitablecpmrate.com/your-direct-link-id"; 

    const examSpecs = {
      ssc: {
        photo: { w: 350, h: 450, maxKb: 45, label: "SSC Photo: 3.5cm x 4.5cm (20-50 KB)" },
        sign: { w: 400, h: 200, maxKb: 18, label: "SSC Signature: 4.0cm x 2.0cm (10-20 KB)" }
      },
      upsc: {
        photo: { w: 550, h: 550, maxKb: 250, label: "UPSC Photo: Square (20-300 KB)" },
        sign: { w: 550, h: 550, maxKb: 250, label: "UPSC Signature: Square (20-300 KB)" }
      },
      ibps: {
        photo: { w: 350, h: 450, maxKb: 45, label: "Banking Photo: 20-50 KB" },
        sign: { w: 400, h: 200, maxKb: 18, label: "Banking Signature: 10-20 KB" }
      },
      rrb: {
        photo: { w: 350, h: 450, maxKb: 65, label: "RRB Photo: 30-70 KB" },
        sign: { w: 400, h: 200, maxKb: 28, label: "RRB Signature: 15-30 KB" }
      },
      nta: {
        photo: { w: 400, h: 500, maxKb: 180, label: "NTA Photo: 10-200 KB" },
        sign: { w: 400, h: 150, maxKb: 28, label: "NTA Signature: 4-30 KB" }
      }
    };

    function updateExamSpecs() {
      const selectedExam = document.getElementById('examSelect').value;
      const modeText = activeMode === 'photo' ? 'PHOTO' : 'SIGNATURE';
      document.getElementById('generateBtn').innerText = `⚡ GENERATE ${selectedExam.toUpperCase()} ${modeText}`;
      if (rawImage) generateFile();
    }

    function setMode(mode) {
      activeMode = mode;
      rawImage = null;
      base64Output = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('inputPreview').style.display = 'none';
      document.getElementById('uploadPrompt').style.display = 'flex';
      document.getElementById('outputCard').style.display = 'none';

      if (mode === 'photo') {
        document.getElementById('tabPhoto').classList.add('active');
        document.getElementById('tabSign').classList.remove('active');
        document.getElementById('modeIcon').innerText = '📷';
        document.getElementById('uploadText').innerText = 'Tap to select Passport Photo';
      } else {
        document.getElementById('tabSign').classList.add('active');
        document.getElementById('tabPhoto').classList.remove('active');
        document.getElementById('modeIcon').innerText = '✍️';
        document.getElementById('uploadText').innerText = 'Tap to select Signature Image';
      }
      updateExamSpecs();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const preview = document.getElementById('inputPreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('uploadPrompt').style.display = 'none';
        rawImage = new Image();
        rawImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function generateFile() {
      if (!rawImage) { 
        alert("Please select an image first!"); 
        return; 
      }

      const examKey = document.getElementById('examSelect').value;
      const spec = examSpecs[examKey][activeMode];

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = spec.w;
      canvas.height = spec.h;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, spec.w, spec.h);

      const imgRatio = rawImage.width / rawImage.height;
      const targetRatio = spec.w / spec.h;
      let sWidth, sHeight, sx, sy;

      if (imgRatio > targetRatio) {
        sHeight = rawImage.height; 
        sWidth = rawImage.height * targetRatio;
        sx = (rawImage.width - sWidth) / 2; 
        sy = 0;
      } else {
        sWidth = rawImage.width; 
        sHeight = rawImage.width / targetRatio;
        sx = 0; 
        sy = (rawImage.height - sHeight) / 2;
      }

      ctx.drawImage(rawImage, sx, sy, sWidth, sHeight, 0, 0, spec.w, spec.h);

      let minQ = 0.1, maxQ = 0.98, targetQuality = 0.75;
      for (let i = 0; i < 7; i++) {
        let midQ = (minQ + maxQ) / 2;
        let testData = canvas.toDataURL('image/jpeg', midQ);
        let sizeKb = (testData.length * 0.75) / 1024;
        targetQuality = midQ;
        if (sizeKb > spec.maxKb) {
          maxQ = midQ;
        } else {
          minQ = midQ;
        }
      }

      base64Output = canvas.toDataURL('image/jpeg', targetQuality);
      const finalSizeKb = ((base64Output.length * 0.75) / 1024).toFixed(1);

      document.getElementById('outputImg').src = base64Output;
      document.getElementById('specsLabel').innerText = `${spec.label.split('(')[0]} • ${finalSizeKb} KB`;
      document.getElementById('outputCard').style.display = 'flex';
      document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
    }

    function handleDownload() {
      if (!base64Output) return;

      if (activeMode === 'sign' && ADSTERRA_DIRECT_LINK && !ADSTERRA_DIRECT_LINK.includes("your-direct-link-id")) {
        window.open(ADSTERRA_DIRECT_LINK, '_blank');
      }

      const examKey = document.getElementById('examSelect').value;
      const link = document.createElement('a');
      link.href = base64Output;
      link.download = `${examKey.toUpperCase()}_${activeMode.toUpperCase()}_${Date.now()}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
